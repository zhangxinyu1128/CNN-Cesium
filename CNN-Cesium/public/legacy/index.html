<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/legacy/cesium/Widgets/widgets.css">
    <script src="/legacy/cesium/Cesium.js"></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon_System</title>
    <script>
      (() => {
        try {
          if (window.top !== window.self) document.documentElement.classList.add('main-screen-embedded')
        } catch {}
      })()
    </script>
    <style>
      /* The main page embeds this legacy screen below its own title. */
      html.main-screen-embedded .layout .layout-footer {
        display: none !important;
      }

      html.main-screen-embedded .layout-main .widget-panel:has(.list-panel) {
        top: 4px !important;
        left: 4px !important;
        width: min(18vw, 400px) !important;
        height: calc(68vh - 4px) !important;
        bottom: auto !important;
        transform: none !important;
        transform-origin: top left;
      }

      html.main-screen-embedded .layout-main .widget-panel:has(.list-panel) .widget-panel-main {
        height: calc(100% - 35px) !important;
        max-height: none !important;
        overflow: hidden;
      }

      html.main-screen-embedded .layout-main .widget-panel:has(.list-panel) .el-table {
        height: 100% !important;
      }

      html.main-screen-embedded .layout-main .widget-panel:has(#map-container) {
        top: auto !important;
        bottom: 4px !important;
        left: 4px !important;
        width: min(18vw, 400px) !important;
        height: calc(32vh - 4px) !important;
      }

      html.main-screen-embedded .layout-main .widget-panel:has(#map-container) .widget-panel-main {
        height: calc(100% - 35px) !important;
      }

      /* The template demo charts are placeholders; real curves live in the analysis panel. */
      html.main-screen-embedded .layout-main .widget-panel[style*="top: 15vh"],
      html.main-screen-embedded .layout-main .widget-panel[style*="top: 48vh"] {
        display: none !important;
      }

      /* The intensity legend is rendered in the history table header instead. */
      html.main-screen-embedded .typhoon-legend {
        display: none !important;
      }

      /* The embedded screen is read from a distance; enlarge the typhoon list text. */
      html.main-screen-embedded .widget-panel-title {
        font-size: 21px !important;
      }

      html.main-screen-embedded .el-table {
        font-size: 16px !important;
      }

      html.main-screen-embedded .el-table th.el-table__cell,
      html.main-screen-embedded .el-table td.el-table__cell {
        font-size: 16px !important;
      }

      html.main-screen-embedded .el-table .cell {
        line-height: 24px !important;
      }

      html.main-screen-embedded .widget-panel .el-select__wrapper {
        font-size: 15px !important;
      }

      html.main-screen-embedded .el-select-dropdown__item {
        font-size: 15px !important;
      }
    </style>
    <script>
      (() => {
        try {
          const state = JSON.parse(localStorage.getItem('typhoon-store') || '{}')
          localStorage.setItem('typhoon-store', JSON.stringify({ ...state, selectedYear: '2025' }))
        } catch {}

        const originalOpen = XMLHttpRequest.prototype.open
        let redirectedInitialYear = false
        XMLHttpRequest.prototype.open = function (method, url, async, username, password) {
          let nextUrl = String(url)
          if (!redirectedInitialYear && /\/api\/2024\.json(?:\?|$)/.test(nextUrl)) {
            nextUrl = nextUrl.replace('/api/2024.json', '/api/2025.json')
            redirectedInitialYear = true
          }
          return originalOpen.call(this, method, nextUrl, async, username, password)
        }
      })()
    </script>
    <script src="/legacy/replay-bridge.js"></script>
    <script type="module" crossorigin src="/legacy/assets/index-CQH6EaLQ.js"></script>
    <link rel="stylesheet" crossorigin href="/legacy/assets/index-BqmoK0ws.css">
  </head>
  <body>
    <div id="app"></div>
    <a
      href="/?workspace=1"
      style="position:fixed;right:18px;bottom:42px;z-index:2000;padding:8px 12px;border:1px solid #4fd1c5;border-radius:4px;color:#d9ffff;background:#062b3ddd;font:13px Microsoft YaHei,sans-serif;text-decoration:none"
    >CNN 预测工作台</a>
  </body>
</html>
